<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js"></script>
</head>
<body>
    <div id="image">
        Hover over an image below to display here.
    </div>

    <img class="preview"
         alt="Scenic view of Ha Long Bay with limestone islands and emerald water"
         src="https://static.vinwonders.com/production/2025/02/Ha-Long-Bay-map-banner.jpg"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img class="preview"
         alt="Lantern-lit streets and traditional architecture in Hoi An Ancient Town"
         src="https://th.bing.com/th/id/R.15dec751f538615f99dd19b80dd38462?rik=3be6R5r4iE2euw&amp;pid=ImgRaw&amp;r=0"
         onmouseover="upDate(this)"
         onmouseout="unDo()">

    <img class="preview"
         alt="Panoramic mountain landscape and terraced fields in Sapa"
         src="https://kenhhomestay.com/wp-content/uploads/2022/07/canh-dep-sapa-11.jpeg"
         onmouseover="upDate(this)"
         onmouseout="unDo()">
</body>
</html>
